# Fly.io deployment
#
#   fly launch --no-deploy --copy-config
#   fly secrets set JWT_SECRET=... OTP_PEPPER=... SUPER_ADMIN_PASSWORD=...
#   fly deploy
#
# The database:
#   fly postgres create --name sawaari-db
#   fly postgres attach sawaari-db        # sets DATABASE_URL

app = "sawaari-api"
primary_region = "bom"          # Mumbai
build = """
  cd server
  npm ci --include=dev
  npm run migrate
"""

[env]
  NODE_ENV = "production"
  PORT = "4000"

[[services]]
  internal_port = 4000
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  http_checks = [{ path = "/api/health", interval = "30s", timeout = "5s" }]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"
