# Sawaari web app (SPA) — nginx configuration.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # the service worker and manifest must never be cached long
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json json; }
    }

    # single-page app: every route falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never cache the API from this origin (it lives elsewhere)
    location /api/ {
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
