# Render blueprint — one Static Site.
#
# There is no backend any more: Supabase is the whole backend (Auth,
# Postgres with row-level security, Storage and Realtime). The web app is
# a static bundle that talks to Supabase straight from the browser.
#
#   1. Push this repo to GitHub
#   2. Render → New → Blueprint → select the repo → apply
#   3. Fill in the two variables below
#
# Required environment variables for the static site:
#   VITE_SUPABASE_URL        https://<project-ref>.supabase.co
#   VITE_SUPABASE_ANON_KEY   the anon / publishable key (safe in a browser)
#
# Vite compiles these into the bundle: change one and use
# "Clear build cache & deploy", otherwise the old address is kept.

services:
  - type: web
    name: sawaari-web
    runtime: static
    branch: main
    autoDeploy: true
    rootDir: web
    # --include=dev is required: if NODE_ENV=production is set, npm skips
    # devDependencies and the build fails with "vite is not recognized"
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # the single-page app: every path has to serve index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(self), microphone=()
